<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d47ff" />
  <title>SoL Vietnam</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0d47ff;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .app-card {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 24px;
      padding: 28px 22px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
    }
    .logo-wrap {
      width: 112px;
      height: 112px;
      margin: 0 auto 18px;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
    }
    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    h1 {
      font-size: 1.65rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    p {
      font-size: 0.96rem;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 20px;
    }
    .status-badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      font-size: 0.85rem;
      font-weight: 600;
    }
    .install-btn {
      margin-top: 16px;
      display: none;
      width: 100%;
      padding: 12px 18px;
      border: none;
      border-radius: 14px;
      background: #ffffff;
      color: #0d47ff;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="app-card">
    <div class="logo-wrap">
      <img src="./icon-512.png" alt="SoL Vietnam Logo" />
    </div>
    <h1>SoL Vietnam</h1>
    <p>Ứng dụng Web Progressive (PWA) đang chạy trên GitHub Pages.</p>
    <span class="status-badge" id="networkStatus">Đang kiểm tra kết nối...</span>
    <button class="install-btn" id="installBtn" type="button">Cài đặt ứng dụng</button>
  </main>

  <script>
    const statusEl = document.getElementById("networkStatus");
    const installBtn = document.getElementById("installBtn");
    let deferredPrompt = null;

    function updateNetworkStatus() {
      statusEl.textContent = navigator.onLine ? "Trực tuyến (Online)" : "Ngoại tuyến (Offline)";
    }

    updateNetworkStatus();
    window.addEventListener("online", updateNetworkStatus);
    window.addEventListener("offline", updateNetworkStatus);

    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      deferredPrompt = event;
      installBtn.style.display = "block";
    });

    installBtn.addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.style.display = "none";
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch((err) => {
          console.error("Service Worker registration failed:", err);
        });
      });
    }
  </script>
</body>
</html>
